applications:
  backend:
    type: golang:1.25

    hooks:
      build: |
        set -ex
        go build -o server ./...

        # Export DATABASE_URL for PostgreSQL relationship
        echo >> .environment 'export DATABASE_URL="postgres://$DB_USERNAME:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_PATH"'

    web:
      commands:
        start: ./server -port=$PORT

      locations:
        /:
          passthru: true

